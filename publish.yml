name: Publish ambient video

on:
  schedule:
    # UTC saat - Turkiye saati = UTC+3
    - cron: '0 3 * * *'    # 06:00 TR  (sabah)
    - cron: '0 15 * * *'   # 18:00 TR  (aksam)
  workflow_dispatch:        # elle tetikleme butonu
    inputs:
      privacy:
        description: 'private / unlisted / public'
        default: 'private'
      hours:
        description: 'video suresi (saat)'
        default: '1'
      mode:
        description: 'ambient veya pomodoro'
        default: 'ambient'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: FFmpeg kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Python paketleri
        run: pip install -q -r requirements.txt

      - name: Video uret
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.mode }}" = "pomodoro" ]; then EXTRA="--pomodoro"; fi
          python render.py --outdir out --hours ${{ github.event.inputs.hours || '1' }} $EXTRA

      - name: Ozet
        run: |
          python - <<'PY'
          import json
          m = json.load(open('out/meta.json'))
          print('Baslik :', m['title'])
          print('Frekans:', m['carrier_hz'], 'Hz  beat', m['beat_hz'], 'Hz')
          print('Doku   :', m['texture'])
          PY
          ls -lh out/

      - name: YouTube'a yukle
        env:
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: ${{ github.event.inputs.privacy || 'private' }}
        run: python upload.py out/meta.json
