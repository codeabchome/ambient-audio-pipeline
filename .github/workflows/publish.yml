name: Publish ambient video

on:
  schedule:
    # Gunde 5 video. Hedef kitle: ABD (bu turde en buyuk izleyici +
    # en yuksek CPM). Saatler ET (US Eastern) gununu takip eder:
    #   01:00 UTC = 20-21 ET aksam     -> DOGA    (uyku oncesi, en guclu slot)
    #   05:00 UTC = 00-01 ET gece      -> FREKANS (uykusuzlar + Asya-Pasifik)
    #   13:00 UTC = 08-09 ET sabah     -> MUZIK   (study/focus, tur doner)
    #   18:00 UTC = 13-14 ET oglen     -> FREKANS (populer rotasyon)
    #   22:00 UTC = 17-18 ET aksamustu -> DOGA    (is sonrasi rahatlama)
    - cron: '0 1 * * *'
    - cron: '0 5 * * *'
    - cron: '0 13 * * *'
    - cron: '0 18 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'private / unlisted / public'
        default: 'private'
      hours:
        description: 'video suresi (saat)'
        default: '1'
      carrier:
        description: 'belirli bir frekans (bos birakirsan siradaki gelir)'
        default: ''
      mode:
        description: 'auto / frequency / nature / music'
        default: 'auto'

# state.json'i depoya geri yazabilmek icin
permissions:
  contents: write

# ayni anda iki calisma olursa frekans sayaci bozulmasin
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: FFmpeg kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fluidsynth fluid-soundfont-gm
          ffmpeg -version | head -1

      - name: Python paketleri
        run: pip install -q -r requirements.txt

      - name: Video uret
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.carrier }}" ]; then
            EXTRA="$EXTRA --carrier ${{ github.event.inputs.carrier }}"
          fi
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ] || [ "$MODE" = "auto" ]; then
            # DIKKAT: date +%H sifir dolgulu doner ("01","13").
            # 10# oneki ile onluk sayiya cevrilir, case guvenli calisir.
            H=$((10#$(date -u +%H)))
            case "$H" in
              1|22) MODE=nature ;;     # aksam + aksamustu: doga
              5|18) MODE=frequency ;;  # gece + oglen: populer frekans
              13)   MODE=music ;;      # sabah: calisma/odak muzigi
              *)    MODE=frequency ;;
            esac
          fi
          case "$MODE" in
            nature) EXTRA="$EXTRA --nature" ;;
            music)
              # 3 tur sirayla: gunun gununa gore doner
              G=$(( $(date -u +%-j) % 3 ))
              case "$G" in
                0) EXTRA="$EXTRA --music deep_work" ;;
                1) EXTRA="$EXTRA --music sleep" ;;
                2) EXTRA="$EXTRA --music meditation" ;;
              esac ;;
          esac
          echo "MOD: $MODE"
          python render.py --outdir out --hours ${{ github.event.inputs.hours || '1' }} $EXTRA

      - name: Ozet
        run: |
          python - <<'PY'
          import json
          m = json.load(open('out/meta.json'))
          print('Baslik :', m['title'])
          print('Frekans:', m['carrier_hz'], 'Hz   calinan:', m['played_hz'], 'Hz')
          print('Mod    :', m.get('mode'), ' beat', m['beat_hz'], 'Hz')
          PY
          ls -lh out/

      - name: YouTube'a yukle
        env:
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
        run: python upload.py out/meta.json

      - name: Frekans sayacini kaydet
        if: success()
        run: |
          if [ -f state.json ]; then
            git config user.name  "tonebed-bot"
            git config user.email "actions@github.com"
            git add state.json
            git diff --staged --quiet || git commit -m "frekans sayaci ilerledi [skip ci]"
            # scan workflow'u bu arada push yaptiysa cakismayi coz
            git pull --rebase origin main || true
            git push
          fi
