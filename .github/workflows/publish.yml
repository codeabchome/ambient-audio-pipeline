name: Publish ambient video

on:
  schedule:
    # Gunde 5 video. Hedef kitle: ABD (bu turde en buyuk izleyici +
    # en yuksek CPM). Saatler ET (US Eastern) gununu takip eder:
    # Karar 26.09.2026: frekans durduruldu, gunde 3 PIKSEL SAHNE + DOGA SESI.
    #   01:00 UTC = 20-21 ET aksam     -> DOGA 8 SAAT (uyku slotu)
    #   13:00 UTC = 08-09 ET sabah     -> DOGA 1 saat
    #   22:00 UTC = 17-18 ET aksamustu -> DOGA 1 saat
    # Frekans / muzik sadece elle (mode input) calisir.
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'private / unlisted / public'
        default: 'private'
      hours:
        description: 'video suresi (saat) - bos: 01 UTC slotu 8, digerleri 1'
        default: ''
      carrier:
        description: 'belirli bir frekans (bos birakirsan siradaki gelir)'
        default: ''
      mode:
        description: 'auto / frequency / nature / music'
        default: 'auto'

# state.json'i depoya geri yazabilmek icin
permissions:
  contents: write

# ayni anda iki calisma olursa frekans sayaci bozulmasin
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 210

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: FFmpeg kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fluidsynth fluid-soundfont-gm
          ffmpeg -version | head -1

      - name: Python paketleri
        run: pip install -q -r requirements.txt

      - name: Video uret
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.carrier }}" ]; then
            EXTRA="$EXTRA --carrier ${{ github.event.inputs.carrier }}"
          fi
          # Slot saati: cron gecikse bile tetikleyen cron satirindan okunur
          # ('0 1 * * *' -> 1). Elle calistirmada saatten hesaplanir.
          # DIKKAT: date +%H sifir dolgulu doner -> 10# ile onluga cevir.
          SCHED="${{ github.event.schedule }}"
          if [ -n "$SCHED" ]; then
            H=$(echo "$SCHED" | awk '{print $2}')
          else
            H=$((10#$(date -u +%H)))
          fi
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ] || [ "$MODE" = "auto" ]; then
            case "$H" in
              *)    MODE=nature ;;     # tum slotlar doga + piksel sahne (26.09.2026)
            esac
          fi
          case "$MODE" in
            nature) EXTRA="$EXTRA --nature" ;;
            music)
              # 3 tur sirayla: gunun gununa gore doner
              G=$(( $(date -u +%-j) % 3 ))
              case "$G" in
                0) EXTRA="$EXTRA --music deep_work" ;;
                1) EXTRA="$EXTRA --music sleep" ;;
                2) EXTRA="$EXTRA --music meditation" ;;
              esac ;;
          esac
          # SURE: 01 UTC = ABD aksami uyku slotu -> 8 saat, digerleri 1 saat
          HOURS="${{ github.event.inputs.hours }}"
          if [ -z "$HOURS" ]; then
            if [ "$H" -eq 1 ]; then HOURS=8; else HOURS=1; fi
          fi
          echo "MOD: $MODE  SURE: ${HOURS}h"
          python render.py --outdir out --hours "$HOURS" $EXTRA

      - name: Ozet
        run: |
          python - <<'PY'
          import json
          m = json.load(open('out/meta.json'))
          print('Baslik :', m['title'])
          print('Frekans:', m['carrier_hz'], 'Hz   calinan:', m['played_hz'], 'Hz')
          print('Mod    :', m.get('mode'), ' beat', m['beat_hz'], 'Hz')
          PY
          ls -lh out/

      - name: YouTube'a yukle
        env:
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
          PLAYLIST_ID: 'PLJEdmQp9UwFg'   # Cozy Pixel Nights (sadece doga videolari)
        run: python upload.py out/meta.json

      - name: Frekans sayacini kaydet
        if: success()
        run: |
          if [ -f state.json ]; then
            git config user.name  "tonebed-bot"
            git config user.email "actions@github.com"
            git add state.json
            git diff --staged --quiet || git commit -m "frekans sayaci ilerledi [skip ci]"
            # scan workflow'u bu arada push yaptiysa cakismayi coz
            git pull --rebase origin main || true
            git push
          fi
