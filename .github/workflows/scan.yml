name: Ses kutuphanesi tara

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'rain / ocean / stream / birds / forest / wind / fire / thunder / snow'
        default: 'rain'
      count:
        description: 'kac aday'
        default: '6'
      commit:
        description: 'onaylilari dogrudan approved/ altina yaz (true/false)'
        default: 'true'

permissions:
  contents: write

concurrency:
  group: library-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg + numpy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy

      - name: Tara ve kalite testinden gecir
        env:
          FREESOUND_KEY: ${{ secrets.FREESOUND_KEY }}
        run: |
          python library_scan.py --category ${{ github.event.inputs.category }} --count ${{ github.event.inputs.count }}

      - name: Adaylari artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: adaylar-${{ github.event.inputs.category }}
          path: candidates/
          retention-days: 7

      - name: Onaylilari approved/ altina yaz
        if: ${{ github.event.inputs.commit != 'false' }}
        run: |
          CAT="${{ github.event.inputs.category }}"
          SRC="candidates/$CAT"
          DST="approved/$CAT"

          if [ ! -d "$SRC" ] || [ -z "$(ls -A $SRC/*.wav 2>/dev/null)" ]; then
            echo "Aday yok, atlaniyor."
            exit 0
          fi

          mkdir -p "$DST"
          for f in "$SRC"/*.wav; do
            base=$(basename "${f%.wav}")
            ffmpeg -y -loglevel error -i "$f" -c:a flac -compression_level 8 "$DST/$base.flac"
          done

          ls -lh "$DST"
          echo "--- toplam ---"
          du -sh approved/

          git config user.name  "tonebed-bot"
          git config user.email "actions@github.com"
          git add approved/
          git diff --staged --quiet || git commit -m "kutuphane: $CAT kayitlari eklendi [skip ci]"
          git push
